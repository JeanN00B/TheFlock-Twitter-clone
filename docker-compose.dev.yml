# Dev override: `docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build`
# Overrides prod base with dev images, live mounts, and local ports.
services:
  twitter-db:
    extends: {file: docker-compose.yml, service: twitter-db}

  twitter-backend:
    extends: {file: docker-compose.yml, service: twitter-backend}
    build: {context: ./backend, dockerfile: docker/Dockerfile, target: dev}
    volumes: [./backend/app:/app/app]
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  twitter-frontend:
    extends: {file: docker-compose.yml, service: twitter-frontend}
    build: {context: ./frontend, dockerfile: docker/Dockerfile.dev}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: [./frontend/src:/app/src, ./frontend/public:/app/public, /app/node_modules, /app/.next]
    command: ["pnpm", "dev", "--turbopack"]
